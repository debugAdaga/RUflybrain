<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мозг мухи</title>
    <link rel="stylesheet" type="text/css" href="./css/main.css?v=17">
    <style>
        /* === Чат === */
        #fly-chat {
            position: fixed;
            bottom: 12px; right: 12px;
            width: 380px; height: 520px;
            background: rgba(15,15,22,0.97);
            border: 1px solid rgba(120,180,255,0.3);
            border-radius: 12px;
            display: flex; flex-direction: column;
            z-index: 100000;
            font-family: system-ui, sans-serif; font-size: 13px;
            color: #e8e8f0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            overflow: hidden;
            user-select: none;
        }
        #fly-chat.collapsed { height: 42px; }
        #fly-chat.collapsed .chat-status,
        #fly-chat.collapsed .chat-body,
        #fly-chat.collapsed .chat-input-row { display: none !important; }

        .chat-header {
            padding: 10px 14px;
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; user-select: none;
            border-bottom: 1px solid rgba(120,180,255,0.15);
            flex-shrink: 0;
        }
        .chat-header-title {
            font-weight: 600; color: #8cf;
            display: flex; gap: 7px; align-items: center;
            pointer-events: none;
        }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #666;
            box-shadow: 0 0 6px currentColor;
            transition: background 0.3s;
        }
        .status-dot.loading { background: #fb4; animation: pulse 1.5s infinite; }
        .status-dot.ready   { background: #6f6; }
        .status-dot.error   { background: #f66; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-header-actions { display: flex; gap: 4px; }
        .chat-header-actions button {
            background: transparent; border: none; color: #aab;
            cursor: pointer; font-size: 15px; padding: 2px 8px;
            border-radius: 4px; line-height: 1;
        }
        .chat-header-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .chat-status {
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            font-size: 11px;
            color: #99a;
            border-bottom: 1px solid rgba(120,180,255,0.08);
            flex-shrink: 0;
        }
        .chat-status .progress {
            display: inline-block;
            width: 100px; height: 4px;
            background: #333; border-radius: 2px;
            overflow: hidden; vertical-align: middle;
            margin-left: 6px;
        }
        .chat-status .progress > div {
            height: 100%; background: #8cf;
            width: 0%; transition: width 0.3s;
        }

        .chat-body {
            flex: 1; overflow-y: auto; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(120,180,255,0.3); border-radius: 3px; }

        .msg {
            max-width: 88%; padding: 8px 12px;
            border-radius: 12px; line-height: 1.4;
            word-wrap: break-word;
            animation: msgIn 0.2s ease-out;
        }
        @keyframes msgIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
        .msg.user { align-self: flex-end; background: #2b4a7a; color: #eaf2ff; border-bottom-right-radius: 3px; }
        .msg.fly  { align-self: flex-start; background: #2a2a3a; color: #dfe6f0; border-bottom-left-radius: 3px; }
        .msg.system { align-self: center; background: rgba(80,80,120,0.3); color: #aab; font-size: 11px; font-style: italic; padding: 4px 10px; border-radius: 8px; }
        .msg.thinking { align-self: flex-start; background: #2a2a3a; color: #99a; font-style: italic; }
        .msg.thinking::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

        .chat-input-row {
            display: flex; border-top: 1px solid rgba(120,180,255,0.15);
            padding: 8px; gap: 6px; background: #11111a; flex-shrink: 0;
        }
        .chat-input-row input {
            flex: 1; background: #1a1a24; border: 1px solid #333;
            border-radius: 8px; padding: 8px 10px;
            color: #e8e8f0; font-size: 13px; outline: none;
            font-family: inherit;
        }
        .chat-input-row input:focus { border-color: #4a6fa5; }
        .chat-input-row input:disabled { opacity: 0.5; }
        .chat-input-row button {
            background: #2b4a7a; border: none; border-radius: 8px;
            color: #eaf2ff; padding: 8px 14px; cursor: pointer;
            font-size: 13px; font-weight: 500;
        }
        .chat-input-row button:hover:not(:disabled) { background: #3b5a8a; }
        .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

<body>
    <div id="toolbar">
        <div class="toolbar-left">
            <button class="tool-btn sidebar-toggle" id="sidebarToggle" aria-label="Открыть/закрыть панель">&#9776;</button>
            <button class="tool-btn active" data-tool="feed">Кормить</button>
            <button class="tool-btn" data-tool="touch">Прикоснуться</button>
            <button class="tool-btn" data-tool="air">Ветер</button>
            <button class="tool-btn" data-tool="light" id="lightBtn">Свет: Ярко</button>
            <button class="tool-btn" data-tool="temp" id="tempBtn">Темп.: Нейтрально</button>
            <button class="tool-btn" id="brain3dBtn" aria-pressed="false">Мозг 3D</button>
            <button class="tool-btn" id="activityToggle">Активность</button>
            <button class="tool-btn" id="learnBtn">Обучение</button>
            <button class="tool-btn" id="helpBtn">?</button>
            <button class="tool-btn" id="liteBtn">Лёгкий режим</button>
        </div>
        <div class="toolbar-right">
            <span class="toolbar-title">Мозг мухи</span>
            <img id="centerButton" src="./svg/center.svg" height="24" class="noselect toolbar-icon" alt="Центрировать">
            <img id="clearButton" src="./svg/clear.svg" height="24" class="noselect toolbar-icon" alt="Очистить">
            <a href="https://github.com/snedea/flybrain"><img id="githubButton" src="./svg/github.svg" class="noselect" alt="GitHub"></a>
        </div>
    </div>

    <div id="helpOverlay" class="help-overlay" style="display:none;">
        <div class="help-overlay-header"><span>Руководство</span><button class="help-close-btn" id="helpCloseBtn">&times;</button></div>
        <div class="help-item"><strong>Кормить</strong> — кликните по холсту, чтобы положить еду.</div>
        <div class="help-item"><strong>Чат</strong> — общайся с мухой, она отвечает через нейросеть.</div>
    </div>

    <div id="left-panel">
        <div id="connectome-panel">
            <div class="connectome-header">
                <span class="connectome-label">Коннектом</span>
                <button class="connectome-toggle-btn" id="connectomeToggleBtn" title="Переключить вид (V)">Скрыть</button>
            </div>
            <div class="connectome-subtitle" id="connectomeSubtitle">Загрузка...</div>
            <div id="nodeHolder" class="connectome-grid"></div>
            <div id="neuronTooltip" class="neuron-tooltip"></div>
        </div>
        <div id="drive-meters">
            <div class="drive-row"><span class="drive-label">Состояние</span><span id="behaviorState" class="behavior-state">покой</span></div>
            <div class="drive-row"><span class="drive-label">Голод</span><div class="drive-bar-bg"><div class="drive-bar" id="driveHunger"></div></div></div>
            <div class="drive-row"><span class="drive-label">Страх</span><div class="drive-bar-bg"><div class="drive-bar" id="driveFear"></div></div></div>
            <div class="drive-row"><span class="drive-label">Усталость</span><div class="drive-bar-bg"><div class="drive-bar" id="driveFatigue"></div></div></div>
            <div class="drive-row"><span class="drive-label">Любопытство</span><div class="drive-bar-bg"><div class="drive-bar" id="driveCuriosity"></div></div></div>
            <div class="drive-row"><span class="drive-label">Уход</span><div class="drive-bar-bg"><div class="drive-bar" id="driveGroom"></div></div></div>
        </div>
    </div>

    <div id="caretaker-sidebar" class="caretaker-sidebar">
        <div class="caretaker-sidebar-header">
            <span class="caretaker-sidebar-title">Активность</span>
            <button class="caretaker-sidebar-close" id="caretaker-sidebar-close">&times;</button>
        </div>
        <div class="activity-feed" id="activity-feed-list"></div>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <canvas id='canvas'></canvas>

    <div id="zoom-controls" class="zoom-controls">
        <button class="zoom-btn" id="zoomIn">+</button>
        <button class="zoom-btn" id="zoomOut">&minus;</button>
    </div>

    <div id="education-panel" class="education-panel" style="display:none;"></div>
    <div id="brain3d-overlay" style="display:none;"></div>
    <div id="brain3d-tooltip" style="display:none;"></div>

    <!-- ============================================================
         💬 ЧАТ С НАСТОЯЩЕЙ НЕЙРОСЕТЬЮ
         ============================================================ -->
    <div id="fly-chat">
        <div class="chat-header" id="chatHeader">
            <span class="chat-header-title">
                <span class="status-dot loading" id="statusDot"></span>
                🐝 Муха
            </span>
            <span class="chat-header-actions">
                <button id="chatResetBtn" title="Очистить разговор">↺</button>
                <button id="chatToggleBtn" title="Свернуть">—</button>
            </span>
        </div>
        <div class="chat-status" id="chatStatus">
            <span id="statusText">Загрузка нейросети…</span>
            <span class="progress" id="progressWrap" style="display:none;">
                <div id="progressBar"></div>
            </span>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input-row" id="chatInputRow">
            <input type="text" id="chatInput" placeholder="Загрузка модели…" autocomplete="off" disabled />
            <button id="chatSendBtn" disabled>▶</button>
        </div>
    </div>

    <!-- Оригинальные скрипты flybrain -->
    <script src="./js/vendor/three.min.js"></script>
    <script src="./js/vendor/OrbitControls.js"></script>
    <script type="text/javascript" src="./js/constants.js?v=17"></script>
    <script type="text/javascript" src="./js/connectome.js?v=17"></script>
    <script type="text/javascript" src="./js/brain-worker-bridge.js?v=17"></script>
    <script type="text/javascript" src="./js/neuro-renderer.js?v=17"></script>
    <script type="text/javascript" src="./js/fly-logic.js?v=17"></script>
    <script type="text/javascript" src="./js/brain3d.js?v=17"></script>
    <script type="text/javascript" src="./js/education.js?v=17"></script>
    <script type="text/javascript" src="./js/main.js?v=17"></script>
    <script type="text/javascript" src="./js/caretaker-renderer.js?v=17"></script>
    <script type="text/javascript" src="./js/caretaker-sidebar.js?v=17"></script>
    <script type="text/javascript" src="./js/caretaker-analytics.js?v=17"></script>
    <script type="text/javascript" src="./js/caretaker-calendar.js?v=17"></script>
    <script type="text/javascript" src="./js/caretaker-bridge.js?v=17"></script>

    <!-- ============================================================
         🧠 НАСТОЯЩИЙ ЧАТ (нейросеть в браузере через transformers.js)
         ============================================================ -->
    <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // Настройки transformers.js
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const $ = id => document.getElementById(id);
    const chatEl     = $('fly-chat');
    const headerEl   = $('chatHeader');
    const toggleBtn  = $('chatToggleBtn');
    const resetBtn   = $('chatResetBtn');
    const bodyEl     = $('chatBody');
    const inputEl    = $('chatInput');
    const sendBtn    = $('chatSendBtn');
    const statusDot  = $('statusDot');
    const statusText = $('statusText');
    const progressWrap = $('progressWrap');
    const progressBar  = $('progressBar');

    let generator = null;
    const chatHistory = [];  // [{ role: 'user'|'assistant', content: '...' }]

    // ============================================================
    // Состояние мухи (для контекста в промпте)
    // ============================================================
    const flyMood = {
        hunger: 0.5,
        fear: 0.2,
        mood: 0.6
    };

    function addMsg(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + (cls || 'system');
        div.textContent = text;
        bodyEl.appendChild(div);
        bodyEl.scrollTop = bodyEl.scrollHeight;
        return div;
    }

    function setStatus(text, mode) {
        statusText.textContent = text;
        statusDot.className = 'status-dot ' + (mode || '');
    }

    // ============================================================
    // Загрузка модели
    // ============================================================
    async function loadModel() {
        try {
            setStatus('Загрузка нейросети (первый раз ~350 МБ)…', 'loading');
            progressWrap.style.display = 'inline-block';

            generator = await pipeline(
                'text-generation',
                'onnx-community/Qwen2.5-0.5B-Instruct',
                {
                    dtype: 'q4',
                    device: 'webgpu',
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            const pct = Math.round(data.progress || 0);
                            progressBar.style.width = pct + '%';
                            setStatus(`Загрузка: ${pct}% (${data.file || ''})`, 'loading');
                        } else if (data.status === 'ready') {
                            setStatus('Загрузка: распаковка…', 'loading');
                        } else if (data.status === 'done') {
                            setStatus('Загрузка: почти готово…', 'loading');
                        }
                    }
                }
            ).catch(async (err) => {
                // Если WebGPU недоступен — пробуем на CPU (быстрее загрузится, медленнее работает)
                console.warn('WebGPU недоступен, переключаюсь на CPU:', err.message);
                setStatus('WebGPU нет, грузим на CPU…', 'loading');
                return await pipeline(
                    'text-generation',
                    'onnx-community/Qwen2.5-0.5B-Instruct',
                    {
                        dtype: 'q4',
                        device: 'wasm',
                        progress_callback: (data) => {
                            if (data.status === 'progress') {
                                const pct = Math.round(data.progress || 0);
                                progressBar.style.width = pct + '%';
                                setStatus(`Загрузка: ${pct}%`, 'loading');
                            }
                        }
                    }
                );
            });

            progressWrap.style.display = 'none';
            setStatus('Готова к разговору', 'ready');
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.placeholder = 'Напиши мухе...';
            inputEl.focus();

            addMsg('🐝 Привет. Я муха дрозофила. У меня есть чувства — голод, страх, настроение. Спроси что-нибудь.', 'fly');
        } catch (e) {
            console.error('Ошибка загрузки модели:', e);
            setStatus('Ошибка загрузки: ' + e.message, 'error');
            addMsg('⚠️ Не удалось загрузить нейросеть. Проверь интернет и обнови страницу.', 'system');
        }
    }

    // ============================================================
    // Генерация ответа
    // ============================================================
    async function generateResponse(userText) {
        // Системный промпт: характер мухи + текущее состояние
        const systemPrompt =
            `Ты — муха дрозофила. Ты живая, у тебя есть чувства. ` +
            `Твоё состояние сейчас: голод ${flyMood.hunger.toFixed(2)} (0=сыта, 1=очень голодна), ` +
            `страх ${flyMood.fear.toFixed(2)} (0=спокойна, 1=в панике), ` +
            `настроение ${flyMood.mood.toFixed(2)} (0=грустная, 1=счастливая). ` +
            `Отвечай коротко, 1-2 предложения. Говори от первого лица, по-русски. ` +
            `Иногда вставляй "ж-ж-ж". Если голодна — проси еду. Если напугана — проси защиты. ` +
            `Если тебя хвалят — радуйся. Если ругают — бойся. Не выходи из роли мухи.`;

        // Собираем сообщения для модели
        const messages = [
            { role: 'system', content: systemPrompt },
            ...chatHistory.slice(-6),
            { role: 'user', content: userText }
        ];

        // Генерируем
        const output = await generator(messages, {
            max_new_tokens: 80,
            temperature: 0.85,
            top_p: 0.9,
            do_sample: true,
            repetition_penalty: 1.15
        });

        // Достаём последний ответ ассистента
        let answer = '';
        if (Array.isArray(output) && output[0] && output[0].generated_text) {
            const gen = output[0].generated_text;
            if (Array.isArray(gen)) {
                const last = gen[gen.length - 1];
                answer = last.content || last.text || '';
            } else if (typeof gen === 'string') {
                // Если модель вернула строку — отрезаем промпт
                answer = gen.split('assistant').pop().trim();
            }
        }
        answer = (answer || '').trim();
        if (!answer) answer = 'Ж-ж-ж...';

        // Обновляем состояние мухи в зависимости от ответа/вопроса
        const lower = userText.toLowerCase();
        if (/еда|есть|кушать|голод|корм|яблоко|сахар|мёд/.test(lower)) {
            flyMood.hunger = Math.max(0, flyMood.hunger - 0.3);
            flyMood.mood = Math.min(1, flyMood.mood + 0.1);
        }
        if (/убью|удар|тапок|опасн|страшн|больно|враг/.test(lower)) {
            flyMood.fear = Math.min(1, flyMood.fear + 0.3);
            flyMood.mood = Math.max(0, flyMood.mood - 0.15);
        }
        if (/любл|хорош|молодец|добр|спасибо|друг/.test(lower)) {
            flyMood.mood = Math.min(1, flyMood.mood + 0.2);
            flyMood.fear = Math.max(0, flyMood.fear - 0.15);
        }

        return answer;
    }

    // ============================================================
    // Отправка сообщения
    // ============================================================
    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';

        addMsg(text, 'user');
        chatHistory.push({ role: 'user', content: text });

        // Показываем «думает…»
        const thinkingMsg = addMsg('', 'thinking');
        sendBtn.disabled = true;
        inputEl.disabled = true;

        try {
            const answer = await generateResponse(text);
            thinkingMsg.remove();
            addMsg(answer, 'fly');
            chatHistory.push({ role: 'assistant', content: answer });
        } catch (e) {
            thinkingMsg.remove();
            addMsg('⚠️ Ошибка генерации: ' + e.message, 'system');
            console.error(e);
        } finally {
            sendBtn.disabled = false;
            inputEl.disabled = false;
            inputEl.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    // ============================================================
    // UI кнопки
    // ============================================================
    toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        chatEl.classList.toggle('collapsed');
        toggleBtn.textContent = chatEl.classList.contains('collapsed') ? '+' : '—';
    });

    resetBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Очистить историю разговора?')) return;
        chatHistory.length = 0;
        bodyEl.innerHTML = '';
        addMsg('🔄 Разговор начат заново.', 'system');
        flyMood.hunger = 0.5;
        flyMood.fear = 0.2;
        flyMood.mood = 0.6;
    });

    // Перетаскивание окна чата за шапку
    let dragX = 0, dragY = 0, dragging = false;
    headerEl.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        dragging = true;
        dragX = e.clientX - chatEl.getBoundingClientRect().left;
        dragY = e.clientY - chatEl.getBoundingClientRect().top;
        headerEl.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    headerEl.addEventListener('pointermove', e => {
        if (!dragging) return;
        chatEl.style.left = (e.clientX - dragX) + 'px';
        chatEl.style.top  = (e.clientY - dragY) + 'px';
        chatEl.style.right = 'auto';
        chatEl.style.bottom = 'auto';
    });
    headerEl.addEventListener('pointerup', e => {
        dragging = false;
        try { headerEl.releasePointerCapture(e.pointerId); } catch(_) {}
    });

    // ============================================================
    // Погнали
    // ============================================================
    addMsg('⏳ Загружаю нейросеть. Это займёт 1–3 минуты при первом запуске.', 'system');
    loadModel();

    console.log(
        '%c✅ Чат с реальной нейросетью инициализирован.\n' +
        '• Модель: Qwen2.5-0.5B-Instruct (350 МБ, кэшируется браузером)\n' +
        '• Работает на WebGPU (если есть), иначе на CPU\n' +
        '• Первый запуск — долго, потом мгновенно',
        'color:lime;font-weight:bold'
    );
    </script>
</body>
</html>
