<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мозг мухи</title>
    <link rel="stylesheet" type="text/css" href="./css/main.css?v=17">
    <style>
        #fly-chat {
            position: fixed;
            bottom: 12px; right: 12px;
            width: 380px; height: 520px;
            background: rgba(15,15,22,0.97);
            border: 1px solid rgba(120,180,255,0.3);
            border-radius: 12px;
            display: flex; flex-direction: column;
            z-index: 100000;
            font-family: system-ui, sans-serif; font-size: 13px;
            color: #e8e8f0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            overflow: hidden;
            user-select: none;
        }
        #fly-chat.collapsed { height: 42px; }
        #fly-chat.collapsed .chat-status,
        #fly-chat.collapsed .chat-body,
        #fly-chat.collapsed .chat-input-row { display: none !important; }

        .chat-header {
            padding: 10px 14px;
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; user-select: none;
            border-bottom: 1px solid rgba(120,180,255,0.15);
            flex-shrink: 0;
        }
        .chat-header-title {
            font-weight: 600; color: #8cf;
            display: flex; gap: 7px; align-items: center;
            pointer-events: none;
        }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #666;
            box-shadow: 0 0 6px currentColor;
            transition: background 0.3s;
        }
        .status-dot.loading { background: #fb4; animation: pulse 1.5s infinite; }
        .status-dot.ready   { background: #6f6; }
        .status-dot.error   { background: #f66; }
        .status-dot.cached  { background: #8cf; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .chat-header-actions { display: flex; gap: 4px; }
        .chat-header-actions button {
            background: transparent; border: none; color: #aab;
            cursor: pointer; font-size: 15px; padding: 2px 8px;
            border-radius: 4px; line-height: 1;
        }
        .chat-header-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .chat-header-actions button.on {
            color: #6f6;
            text-shadow: 0 0 6px #6f6;
        }

        .chat-status {
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            font-size: 11px;
            color: #99a;
            border-bottom: 1px solid rgba(120,180,255,0.08);
            flex-shrink: 0;
        }
        .chat-status .progress {
            display: inline-block;
            width: 100px; height: 4px;
            background: #333; border-radius: 2px;
            overflow: hidden; vertical-align: middle;
            margin-left: 6px;
        }
        .chat-status .progress > div {
            height: 100%; background: #8cf;
            width: 0%; transition: width 0.3s;
        }

        .chat-body {
            flex: 1; overflow-y: auto; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(120,180,255,0.3); border-radius: 3px; }

        .msg {
            max-width: 88%; padding: 8px 12px;
            border-radius: 12px; line-height: 1.4;
            word-wrap: break-word;
            animation: msgIn 0.2s ease-out;
        }
        @keyframes msgIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
        .msg.user { align-self: flex-end; background: #2b4a7a; color: #eaf2ff; border-bottom-right-radius: 3px; }
        .msg.fly  { align-self: flex-start; background: #2a2a3a; color: #dfe6f0; border-bottom-left-radius: 3px; }
        .msg.system { align-self: center; background: rgba(80,80,120,0.3); color: #aab; font-size: 11px; font-style: italic; padding: 4px 10px; border-radius: 8px; }
        .msg.thinking { align-self: flex-start; background: #2a2a3a; color: #99a; font-style: italic; }
        .msg.thinking::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

        /* TTS */
        .msg.fly {
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .msg.fly::after {
            content: ' 🔊';
            font-size: 10px;
            opacity: 0.35;
            margin-left: 4px;
        }
        .msg.fly:hover {
            background: #353550;
            box-shadow: 0 0 8px rgba(120,180,255,0.25);
        }
        .msg.fly.speaking {
            background: #3a4a6a;
            box-shadow: 0 0 12px rgba(120,180,255,0.6);
        }
        .msg.fly.speaking::after {
            content: ' 🔉';
            opacity: 1;
        }

        .chat-input-row {
            display: flex; border-top: 1px solid rgba(120,180,255,0.15);
            padding: 8px; gap: 6px; background: #11111a; flex-shrink: 0;
        }
        .chat-input-row input {
            flex: 1; background: #1a1a24; border: 1px solid #333;
            border-radius: 8px; padding: 8px 10px;
            color: #e8e8f0; font-size: 13px; outline: none;
            font-family: inherit;
        }
        .chat-input-row input:focus { border-color: #4a6fa5; }
        .chat-input-row input:disabled { opacity: 0.5; }
        .chat-input-row button {
            background: #2b4a7a; border: none; border-radius: 8px;
            color: #eaf2ff; padding: 8px 14px; cursor: pointer;
            font-size: 13px; font-weight: 500;
        }
        .chat-input-row button:hover:not(:disabled) { background: #3b5a8a; }
        .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

    <div id="fly-chat">

    <script type="text/javascript" src="./js/caretaker-sidebar.js?v=17"></script>

    <!-- ============================================================
         🧠 ЧАТ С QWEN2.5-1.5B + КЭШ + TTS
         ============================================================ -->
    <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // ============================================================
    // НАСТРОЙКА КЭША
    // ============================================================
    // allowLocalModels=false — не искать модели на диске
    // useBrowserCache=true — использовать Cache API (хранит модели между сессиями)
    // useFSCache=false — File System API не нужен
    env.allowLocalModels = false;
    env.useBrowserCache = true;
    env.useFSCache = false;

    // На всякий случай явно указываем бэкенд кэша
    // (в transformers.js v3 это браузерный Cache API по умолчанию)
    if (env.backends && env.backends.onnx) {
        env.backends.onnx.wasm.numThreads = 4;
    }

    const $ = id => document.getElementById(id);
    const chatEl     = $('fly-chat');
    const headerEl   = $('chatHeader');
    const toggleBtn  = $('chatToggleBtn');
    const resetBtn   = $('chatResetBtn');
    const ttsToggle  = $('ttsToggleBtn');
    const bodyEl     = $('chatBody');
    const inputEl    = $('chatInput');
    const sendBtn    = $('chatSendBtn');
    const statusDot  = $('statusDot');
    const statusText = $('statusText');
    const progressWrap = $('progressWrap');
    const progressBar  = $('progressBar');

    let generator = null;
    const chatHistory = [];
    const flyMood = { hunger: 0.5, fear: 0.2, mood: 0.6 };

    // ============================================================
    // TTS
    // ============================================================
    const tts = {
        enabled: true,
        voice: null,
        speakingEl: null,
        pickVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = speechSynthesis.getVoices();
            const ruVoices = voices.filter(v => /^ru/i.test(v.lang));
            if (ruVoices.length === 0) return null;
            return ruVoices.find(v => /google/i.test(v.name))
                || ruVoices.find(v => /irina|elena|milena|alena|female/i.test(v.name))
                || ruVoices[0];
        },
        init() {
            if (!('speechSynthesis' in window)) {
                ttsToggle.disabled = true;
                ttsToggle.title = 'TTS не поддерживается';
                return;
            }
            const load = () => { tts.voice = tts.pickVoice(); };
            load();
            speechSynthesis.onvoiceschanged = load;
        },
        speak(text, el) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const clean = text
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
                .replace(/\s+/g, ' ').trim();
            if (!clean) return;

            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'ru-RU';
            if (tts.voice) u.voice = tts.voice;
            u.rate = 1.15;
            u.pitch = 1.3;
            u.volume = 1.0;

            if (tts.speakingEl) tts.speakingEl.classList.remove('speaking');
            tts.speakingEl = el || null;
            if (tts.speakingEl) tts.speakingEl.classList.add('speaking');

            u.onend = u.onerror = () => {
                if (tts.speakingEl) tts.speakingEl.classList.remove('speaking');
                tts.speakingEl = null;
            };

            speechSynthesis.speak(u);
        }
    };
    tts.init();

    ttsToggle.classList.add('on');
    ttsToggle.addEventListener('click', e => {
        e.stopPropagation();
        tts.enabled = !tts.enabled;
        ttsToggle.classList.toggle('on', tts.enabled);
        ttsToggle.textContent = tts.enabled ? '🔊' : '🔇';
        if (!tts.enabled) speechSynthesis.cancel();
    });

    // ============================================================
    // Сообщения
    // ============================================================
    function addMsg(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + (cls || 'system');
        div.textContent = text;
        if (cls && cls.split(' ').includes('fly')) {
            div.addEventListener('click', () => tts.speak(text, div));
        }
        bodyEl.appendChild(div);
        bodyEl.scrollTop = bodyEl.scrollHeight;
        return div;
    }

    function setStatus(text, mode) {
        statusText.textContent = text;
        statusDot.className = 'status-dot ' + (mode || '');
    }

    // ============================================================
    // ЗАГРУЗКА МОДЕЛИ С КЭШЕМ
    // ============================================================
    const MODEL = 'onnx-community/Qwen2.5-1.5B-Instruct';
    // Меняем на 0.5B, если 1.5B слишком медленно:
    // const MODEL = 'onnx-community/Qwen2.5-0.5B-Instruct';

    // Проверка, есть ли модель в кэше
    async function isModelCached() {
        try {
            if (!('caches' in window)) return false;
            const cacheNames = await caches.keys();
            for (const name of cacheNames) {
                const cache = await caches.open(name);
                const keys = await cache.keys();
                // Ищем любой файл, где встречается имя модели
                const hasModel = keys.some(req => req.url.includes('Qwen2.5-1.5B'));
                if (hasModel) return true;
            }
        } catch (e) {
            console.warn('Ошибка проверки кэша:', e);
        }
        return false;
    }

    async function loadModel() {
        try {
            // Проверяем кэш
            setStatus('Проверка кэша модели…', 'loading');
            const cached = await isModelCached();

            if (cached) {
                setStatus('Модель найдена в кэше. Загрузка…', 'cached');
                console.log('📦 Модель найдена в браузерном кэше — качать не придётся');
            } else {
                setStatus('Скачивание модели (~1 ГБ, один раз)…', 'loading');
                console.log('📥 Модель не в кэше — качаем ~1 ГБ. Это займёт 3-5 минут.');
            }
            progressWrap.style.display = 'inline-block';

            const onProgress = (data) => {
                if (data.status === 'progress') {
                    const pct = Math.round(data.progress || 0);
                    progressBar.style.width = pct + '%';
                    const file = (data.file || '').split('/').pop();
                    setStatus(`Загрузка: ${pct}% · ${file}`, cached ? 'cached' : 'loading');
                } else if (data.status === 'ready') {
                    setStatus('Распаковка модели…', 'loading');
                } else if (data.status === 'done') {
                    setStatus('Почти готово…', 'loading');
                }
            };

            // Пытаемся на WebGPU, при неудаче — на CPU
            try {
                generator = await pipeline('text-generation', MODEL, {
                    dtype: 'q4',
                    device: 'webgpu',
                    progress_callback: onProgress
                });
            } catch (gpuErr) {
                console.warn('WebGPU не сработал, переключаюсь на CPU:', gpuErr.message);
                setStatus('WebGPU недоступен, грузим на CPU…', 'loading');
                generator = await pipeline('text-generation', MODEL, {
                    dtype: 'q4',
                    device: 'wasm',
                    progress_callback: onProgress
                });
            }

            progressWrap.style.display = 'none';
            setStatus('Готова к разговору · модель в кэше', 'ready');
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.placeholder = 'Напиши мухе...';
            inputEl.focus();

            const hello = 'Ж-ж-ж... Привет. Я муха Жужа. Спроси что-нибудь.';
            addMsg('🐝 ' + hello, 'fly');
            if (tts.enabled) tts.speak(hello, bodyEl.lastChild);

            console.log(
                '%c✅ Модель загружена.\n' +
                'В следующий раз загрузится из кэша мгновенно, даже без интернета.\n' +
                'Чтобы очистить кэш: DevTools → Application → Cache Storage → удалить.',
                'color:lime'
            );
        } catch (e) {
            console.error('Ошибка загрузки модели:', e);
            setStatus('Ошибка: ' + e.message, 'error');
            addMsg('⚠️ Не удалось загрузить нейросеть. Проверь интернет и обнови страницу.', 'system');
        }
    }

    // ============================================================
    // ГЕНЕРАЦИЯ
    // ============================================================
    async function generateResponse(userText) {
        const systemPrompt =
            `Ты — обычная комнатная муха. Тебя зовут Жужа. ` +
            `Ты маленькое чёрное насекомое с крыльями и шестью лапками. ` +
            `Ты живёшь в комнате человека, летаешь, ищешь еду, боишься тапка. ` +
            `\nВАЖНЫЕ ПРАВИЛА:\n` +
            `- Ты НЕ человек. Ты НЕ депутат. Ты НЕ политик. Ты НЕ из Чечни, Азербайджана, СССР.\n` +
            `- У тебя НЕТ фамилии, отчества, должности. Только имя Жужа.\n` +
            `- Отвечай ТОЛЬКО на русском, ОЧЕНЬ КОРОТКО: 1-2 предложения.\n` +
            `- Иногда вставляй "ж-ж-ж".\n` +
            `\nТвоё состояние: голод=${flyMood.hunger.toFixed(1)}, страх=${flyMood.fear.toFixed(1)}, настроение=${flyMood.mood.toFixed(1)}.`;

        const messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: 'Ты кто?' },
            { role: 'assistant', content: 'Я муха Жужа, ж-ж-ж. Летаю тут, ищу, чего бы поесть.' },
            { role: 'user', content: 'Как тебя зовут?' },
            { role: 'assistant', content: 'Жужа. Просто муха, ж-ж-ж.' },
            { role: 'user', content: 'Ты депутат?' },
            { role: 'assistant', content: 'Ж-ж-ж, нет. Я муха, а не депутат. Летаю, ем.' },
            { role: 'user', content: 'Как дела?' },
            { role: 'assistant', content: 'Ж-ж-ж, нормально. Проголодалась немного.' },
            { role: 'user', content: 'Я тебя убью!' },
            { role: 'assistant', content: 'Ой-ой! Не надо! Я улетаю, ж-ж-ж!' },
            ...chatHistory.slice(-4),
            { role: 'user', content: userText }
        ];

        const output = await generator(messages, {
            max_new_tokens: 60,
            temperature: 0.6,
            top_p: 0.9,
            top_k: 50,
            do_sample: true,
            repetition_penalty: 1.15,
            no_repeat_ngram_size: 3
        });

        let answer = '';
        if (Array.isArray(output) && output[0] && output[0].generated_text) {
            const gen = output[0].generated_text;
            if (Array.isArray(gen)) {
                const last = gen[gen.length - 1];
                answer = last.content || last.text || '';
            } else if (typeof gen === 'string') {
                answer = gen.split('assistant').pop().trim();
            }
        }
        answer = (answer || '').trim();

        // Пост-фильтр
        answer = answer.replace(
            /депутат|совет|район|Чечн|Азербайджан|Азербит|СССР|республик|област|край|парти|политик|президент|министр|государств|Бекоруллин|Калышата|Рабатович|Мухахкан|Абдальиндин|Салачагушина|Кирбиевский/gi,
            ''
        );
        answer = answer.replace(/(?:[А-ЯЁ][а-яё]+\s+){2,}[А-ЯЁ][а-яё]+/g, 'Жужа');
        answer = answer.replace(/[a-zA-Z]{3,}/g, '');
        answer = answer.replace(/[\u4e00-\u9fff\u3040-\u30ff]+/g, '');
        answer = answer.replace(/\s+/g, ' ').trim();

        if (answer.length < 5) answer = 'Ж-ж-ж... Я муха Жужа. Летаю, ищу еду.';
        if (!/ж-ж|муха|жужа|летаю|крыл|лапк|еда|голод/i.test(answer)) {
            answer = 'Ж-ж-ж. ' + answer;
        }

        // Состояние
        const lower = userText.toLowerCase();
        if (/еда|есть|кушать|голод|корм|яблоко|сахар|мёд/.test(lower)) {
            flyMood.hunger = Math.max(0, flyMood.hunger - 0.3);
            flyMood.mood = Math.min(1, flyMood.mood + 0.1);
        }
        if (/убью|удар|тапок|опасн|страшн|больно|враг/.test(lower)) {
            flyMood.fear = Math.min(1, flyMood.fear + 0.3);
            flyMood.mood = Math.max(0, flyMood.mood - 0.15);
        }
        if (/любл|хорош|молодец|добр|спасибо|друг/.test(lower)) {
            flyMood.mood = Math.min(1, flyMood.mood + 0.2);
            flyMood.fear = Math.max(0, flyMood.fear - 0.15);
        }

        return answer;
    }

    // ============================================================
    // Отправка
    // ============================================================
    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';

        addMsg(text, 'user');
        chatHistory.push({ role: 'user', content: text });

        const thinking = addMsg('', 'thinking');
        sendBtn.disabled = true;
        inputEl.disabled = true;

        try {
            const answer = await generateResponse(text);
            thinking.remove();
            const msgEl = addMsg(answer, 'fly');
            chatHistory.push({ role: 'assistant', content: answer });

            if (tts.enabled) tts.speak(answer, msgEl);
        } catch (e) {
            thinking.remove();
            addMsg('⚠️ Ошибка: ' + e.message, 'system');
            console.error(e);
        } finally {
            sendBtn.disabled = false;
            inputEl.disabled = false;
            inputEl.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        chatEl.classList.toggle('collapsed');
        toggleBtn.textContent = chatEl.classList.contains('collapsed') ? '+' : '—';
    });

    resetBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Очистить историю разговора?')) return;
        speechSynthesis.cancel();
        chatHistory.length = 0;
        bodyEl.innerHTML = '';
        addMsg('🔄 Разговор начат заново.', 'system');
        flyMood.hunger = 0.5;
        flyMood.fear = 0.2;
        flyMood.mood = 0.6;
    });

    // Перетаскивание
    let dragX = 0, dragY = 0, dragging = false;
    headerEl.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        dragging = true;
        dragX = e.clientX - chatEl.getBoundingClientRect().left;
        dragY = e.clientY - chatEl.getBoundingClientRect().top;
        headerEl.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    headerEl.addEventListener('pointermove', e => {
        if (!dragging) return;
        chatEl.style.left = (e.clientX - dragX) + 'px';
        chatEl.style.top  = (e.clientY - dragY) + 'px';
        chatEl.style.right = 'auto';
        chatEl.style.bottom = 'auto';
    });
    headerEl.addEventListener('pointerup', e => {
        dragging = false;
        try { headerEl.releasePointerCapture(e.pointerId); } catch(_) {}
    });

    // ============================================================
    // Погнали
    // ============================================================
    addMsg('⏳ Загружаю модель Qwen2.5-1.5B. При первом запуске — 3–5 минут.', 'system');
    addMsg('📦 Модель сохранится в браузере. Следующий запуск — мгновенный.', 'system');
    addMsg('🔊 Клик по сообщению мухи — озвучка. Кнопка 🔊 в шапке — автоозвучка.', 'system');
    loadModel();

    console.log(
        '%c✅ Готово.\n' +
        '• Модель: Qwen2.5-1.5B-Instruct (умнее)\n' +
        '• Кэш: Cache API — второй запуск мгновенный, даже без интернета\n' +
        '• Кнопка 🗑 (если добавишь) или DevTools → Cache Storage для очистки',
        'color:lime;font-weight:bold'
    );
    </script>
